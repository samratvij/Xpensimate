# Your household. The web app's setup wizard writes household.toml for you (and More → Household edits it);
# this example shows the format if you'd rather write it by hand: copy it to household.toml (which git ignores).
# Hand-edited people apply right away; hand-edited accounts after: docker compose restart api

# Who you are, in a few words. The categorizer (the AI model) reads this to guess who a purchase was for.
description = "two people in Toronto, Canada, Alex and Sam, who also support Alex's parents"

# The currency the apps show amounts in (a 3-letter code: CAD, USD, EUR, GBP, INR, ...). An account in
# another currency sets its own `currency`.
currency = "CAD"

# Purposes: who a purchase was for. The first one is the shared default and is budgeted by category
# (Grocery, Eating Out, ...). The others get their own budget line, shown under "People" in the apps.
#   name                  what the apps show and the categorizer picks from
#   guide                 how the categorizer recognises it (finishes the sentence '"<name>": ...')
#   budget_line           the budget line their spending counts against
#   transfer_budget_line  optional: money sent to them (category Transfer) counts here instead
#   icon                  person | abroad | family
# Avoid budget line names that are also category names.

[[purposes]]
name = "Shared"
guide = "joint household spending (groceries, rent, utilities, eating out, household items). The default."

[[purposes]]
name = "Alex"
guide = "Alex's own spending (their gym or classes, haircuts, health appointments, personal subscriptions, clothes)."
budget_line = "Alex Personal"

[[purposes]]
name = "Sam"
guide = "Sam's own spending (their gym or classes, haircuts, health appointments, personal subscriptions, clothes)."
budget_line = "Sam Personal"

[[purposes]]
name = "Parents"
guide = "spending for Alex's parents (money sent to them, shopping or appointments for them)."
budget_line = "Parents Shopping"
transfer_budget_line = "Parents"
icon = "family"

# Example of spending in another country, kept apart from everyday personal spending:
# [[purposes]]
# name = "Sam Abroad"
# guide = "Sam's spending while abroad (foreign merchants, foreign currency)."
# budget_line = "Sam Abroad"
# icon = "abroad"

# Accounts: your cards and bank accounts. Alerts are matched to an account by card_last4 (in quotes); an
# account with several cards (a shared credit card with one card each) lists them all: ["1234", "9876"].
# kind: chequing, credit_card, savings, investment, retirement, loan or asset (TFSA, RRSP, 401k, ISA and
# similar names work too). owner: whose it is, one of the purposes above (Shared if left out).
# These ids are the ones the bank parsers fall back to when an alert has no card digits, so keep them
# for the banks you use; add more accounts with any id you like.
#   Tangerine: tangerine_mastercard, tangerine_cheq    PC Financial: pc_mastercard, pc_money
#   Canadian Tire: ctfs_triangle    Wealthsimple: ws_credit, ws_cash    RBC: matched by card digits only

[[accounts]]
id = "tangerine_mastercard"
institution = "Tangerine"
name = "Tangerine Money-Back World Mastercard"
card_last4 = ["1234", "9876"]
kind = "credit_card"

[[accounts]]
id = "ws_credit"
institution = "Wealthsimple"
name = "Wealthsimple Credit Card"
card_last4 = "5678"
kind = "credit_card"
owner = "Alex"

[[accounts]]
id = "rbc_visa"
institution = "RBC"
name = "RBC Visa (Sam)"
card_last4 = "4321"
kind = "credit_card"
owner = "Sam"

# Bank accounts: pay lands in chequing; savings and investments make up the savings rate and net worth.
[[accounts]]
id = "tangerine_cheq"
institution = "Tangerine"
name = "Tangerine Chequing"
kind = "chequing"

[[accounts]]
id = "tangerine_savings"
institution = "Tangerine"
name = "Tangerine Savings"
kind = "savings"

[[accounts]]
id = "ws_invest"
institution = "Wealthsimple"
name = "Wealthsimple Investing"
kind = "investment"
owner = "Alex"
