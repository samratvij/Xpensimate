[[purposes]]
name = "Shared"
guide = "joint household spending (groceries, rent, utilities, eating out, household items). The default."

[[purposes]]
name = "Alex"
guide = "Alex's own spending (their gym or classes, haircuts, health appointments, personal subscriptions, clothes)."
